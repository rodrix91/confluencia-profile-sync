name: Review public profile metadata changes

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'approved/**'
      - 'state/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

# Pull requests, including fork-origin PRs, never receive write permissions.
permissions:
  contents: read

concurrency:
  group: public-profile-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    name: Python offline policy and retention contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out proposed change (read-only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check all Python module syntax
        run: python -m py_compile scripts/*.py

      - name: Exercise offline identity, safety and retention contracts
        run: python scripts/profile-job.test.py -v

      - name: Verify snapshot JSON syntax
        run: |
          python -m json.tool approved/references.json > /dev/null
          python -m json.tool state/current.json > /dev/null
